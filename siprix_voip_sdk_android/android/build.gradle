group 'com.siprix.voip_sdk'
version '1.0-SNAPSHOT'

def siprixOriginalAar = file("$projectDir/libs/siprix_voip_sdk.original.aar")
def siprixGeneratedDir = file("$buildDir/generated/siprix")
def siprixPatchedClassesJar = file("$siprixGeneratedDir/classes.jar")
def siprixPatchedJniDir = file("$siprixGeneratedDir/jni")
def siprixPatchDir = file("$buildDir/intermediates/siprixAarPatch")

buildscript {
    ext.kotlin_version = '1.7.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        flatDir {
            dirs project(':siprix_voip_sdk_android').file('libs')
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def patchSiprixAarTask = tasks.register('patchSiprixAar') {
    inputs.file(siprixOriginalAar)
    outputs.file(siprixPatchedClassesJar)
    outputs.dir(siprixPatchedJniDir)

    doLast {
        if (!siprixOriginalAar.exists()) {
            throw new GradleException("Missing original Siprix AAR at ${siprixOriginalAar}")
        }

        delete(siprixPatchDir, siprixGeneratedDir)

        copy {
            from zipTree(siprixOriginalAar)
            into siprixPatchDir
        }

        def extractedClassesDir = new File(siprixPatchDir, 'classes')
        def extractedClassesJar = new File(siprixPatchDir, 'classes.jar')

        copy {
            from zipTree(extractedClassesJar)
            into extractedClassesDir
        }

        delete(fileTree(extractedClassesDir) {
            include 'org/webrtc/**'
            exclude 'org/webrtc/apprtc/**'
            exclude 'org/webrtc/voiceengine/**'
        })

        delete(extractedClassesJar)
        ant.zip(destfile: extractedClassesJar) {
            fileset(dir: extractedClassesDir)
        }
        delete(extractedClassesDir)

        siprixGeneratedDir.mkdirs()

        copy {
            from extractedClassesJar
            into siprixGeneratedDir
            rename { 'classes.jar' }
        }

        copy {
            from new File(siprixPatchDir, 'jni')
            into siprixPatchedJniDir
        }
    }
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.siprix.voip_sdk'
    }

    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.jniLibs.srcDirs += siprixPatchedJniDir
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
    }

    dependencies {
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'org.mockito:mockito-core:5.0.0'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(patchSiprixAarTask)
}

dependencies {    
    compileOnly 'io.github.webrtc-sdk:android:144.7559.01'
    implementation(files(siprixPatchedClassesJar) {
        builtBy(patchSiprixAarTask)
    })
}
